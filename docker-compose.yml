services:
  market-sentinel:
    image: ghcr.io/graddy2388/market-sentinel_1_2026:latest
    container_name: market-sentinel
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      # Non-secret configuration only
      - MCP_TRANSPORT=sse
      - MCP_PORT=3100
      - DB_PATH=/data/data.db
    volumes:
      # Secrets injected from 1Password (see scripts/setup-secrets.sh)
      # Contains API keys, Discord token, and channel ID
      - /opt/market-sentinel/secrets.env:/app/.env:ro
      - sentinel-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sentinel-data:
